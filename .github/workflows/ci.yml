name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt -w:"; echo "$unformatted"; exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: build
        run: go build ./...

      - name: build (postgres adapter)
        run: go build -tags postgres ./...

      - name: test (race)
        run: go test -race ./...

      - name: example smoke
        run: go run ./examples/durable

  # Validates the self-built engine + DBOS-Go arm on REAL Postgres (decision #1
  # comparison + decision #4), via embedded-postgres — no Docker daemon needed.
  postgres-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: G1 + store + DBOS arm on real Postgres
        run: go test -tags postgres ./internal/pgtest/ -v
