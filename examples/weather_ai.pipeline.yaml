# An agent node: the model itself calls the http_get tool to fetch live weather,
# then produces typed JSON. Demonstrates the full model→tool→model loop.
# Run:  set -a; source model.env; set +a
#       go run ./cmd/flowup run examples/weather_ai.pipeline.yaml --params '{"city":"Tokyo"}'
pipeline: weather_ai
version: 1
description: An agent node where the model calls http_get for live weather, then returns JSON.
input_schema:
  type: object
  required: [city]
  properties:
    city: { type: string }
nodes:
  - id: report
    kind: agent
    needs: []
    requires_caps: []
    profile:
      models: [default]
      role: "You fetch live weather. Call the http_get tool with url https://wttr.in/<CITY>?format=3 (URL-encode the city). Then reply with ONLY a JSON object {\"report\": \"<the tool's text>\"}. No prose, no code fences."
      tools: [http_get]
      temp: 0.0
    inputs:
      city: "{{ params.city }}"
    limits: { max_steps: 4, budget_usd: 0, timeout_sec: 180 }
    retry: { max_attempts: 3, on: [retriable] }
    output_schema:
      type: object
      required: [report]
      properties:
        report: { type: string }
output:
  weather: "{{ report.report }}"
