# A one-node semantic pipeline answered by a real model.
# Run:  set -a; source model.env; set +a
#       go run ./cmd/flowup run examples/ask.pipeline.yaml --params '{"q":"..."}'
# (profile.models is overridden by OPENAI_MODEL; retry self-heals transient model hiccups.)
pipeline: ask
version: 1
description: Send a question to a real model and get typed JSON back.
input_schema:
  type: object
  required: [q]
  properties:
    q: { type: string }
nodes:
  - id: answer
    kind: semantic
    needs: []
    requires_caps: []
    profile:
      models: [default]
      role: "You are a precise assistant. Reply with ONLY a JSON object matching the requested schema. No prose, no markdown, no code fences."
      temp: 0.0
    inputs:
      question: "{{ params.q }}"
    limits: { max_steps: 2, budget_usd: 0, timeout_sec: 150 }
    retry: { max_attempts: 3, on: [retriable] } # real models hiccup occasionally; retry self-heals
    output_schema:
      type: object
      required: [answer]
      properties:
        answer: { type: string }
output:
  answer: "{{ answer.answer }}"
