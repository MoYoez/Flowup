# The built-in demo pipeline, embedded by builtin.go. The YAML is the single
# source of truth; the Mermaid view is derived from it. Fields mirror
# internal/contracts (NodeTask / ExecProfile / Limits).
pipeline: deploy_repo_to_paas
version: 1
description: Build a repo and deploy it to a PaaS, with a health check.

# Pipeline input -> Invocation.params, validated against this schema before the run.
input_schema:
  type: object
  required: [repo_url, target_env]
  properties:
    repo_url:   { type: string, format: uri }
    target_env: { type: string, enum: [staging, prod] }

nodes:
  # build: demonstrates fail -> retry -> slide to the backup model (attempt drives profile.models).
  - id: build
    kind: agent                       # native | semantic | agent
    needs: []                         # no deps = entry node
    requires_caps: [os]               # routed to a worker with a sandbox
    profile:
      models: [claude-opus-4-6, claude-sonnet-4-6]   # primary -> backup, selected by attempt
      role: "Build engineer: clone the repo, install deps, produce a deployable artifact."
      tools: [git, shell, fs]
      temp: 0.0
    inputs:
      repo_url: "{{ params.repo_url }}"
    limits: { max_steps: 30, budget_usd: 0.50, timeout_sec: 600 }
    retry: { max_attempts: 3, on: [retriable] }       # retries exhausted -> failed
    output_schema:                    # sent with the task, validated worker-side before returning
      type: object
      required: [artifact_path, build_sha]
      properties:
        artifact_path: { type: string }
        build_sha:     { type: string }

  # deploy: has a side effect -> exactly-once; on auth/billing -> needs_human suspend + resume.
  - id: deploy
    kind: agent
    needs: [build]
    requires_caps: []
    side_effect: true                 # side-effect node: idempotency key + outbox dedup
    idempotency_key: "{{ params.repo_url }}@{{ build.build_sha }}->{{ params.target_env }}"
    profile:
      models: [claude-sonnet-4-6]
      role: "Release engineer: call the PaaS API to deploy the artifact; hand off to a human on auth/billing."
      tools: [paas_api]
      temp: 0.0
    inputs:
      artifact: "{{ build.artifact_path }}"
      env:      "{{ params.target_env }}"
    limits: { max_steps: 20, budget_usd: 0.30, timeout_sec: 300 }
    on_needs_human:                   # first-class pause: suspended durably, resumed by token
      when:    "authorization or billing needs human approval"
      handoff: "Confirm the deploy to the target environment and accept the cost, then reply to resume."
    output_schema:
      type: object
      required: [deployment_id, url]
      properties:
        deployment_id: { type: string }
        url:           { type: string, format: uri }

  # verify: produces a typed conclusion that becomes the pipeline's ok output.
  - id: verify
    kind: semantic
    needs: [deploy]
    requires_caps: []
    profile:
      models: [claude-haiku-4-5-20251001]
      role: "Verifier: request the deploy URL, decide health, produce a structured conclusion."
      tools: [http_get]
      temp: 0.0
    inputs:
      url: "{{ deploy.url }}"
    limits: { max_steps: 5, budget_usd: 0.05, timeout_sec: 60 }
    output_schema:
      type: object
      required: [healthy, status_code]
      properties:
        healthy:     { type: boolean }
        status_code: { type: integer }

# Pipeline output -> the `output` of the ok three-state result.
output:
  deployment_id: "{{ deploy.deployment_id }}"
  url:           "{{ deploy.url }}"
  healthy:       "{{ verify.healthy }}"
