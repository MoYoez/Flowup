# 生产/集成路线的本地基建。
#
# ⚠️ MVP 不需要这个文件:Spike A 跑在纯 Go SQLite 上(无 Docker、无下载)。
# 这里是决策 #4(Postgres 作状态/事件单一真相源)与 G4(OTel→Jaeger 追踪)
# 落地时的本地环境。届时把引擎的 store 构造器从 NewSQLite 换成
# store.NewPostgres(DSN)(`go build -tags postgres`),durable-exec 接口不变。
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: flowup
      POSTGRES_PASSWORD: flowup
      POSTGRES_DB: flowup
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowup"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Jaeger all-in-one 直接收 OTLP(4317/4318),起步无需单独的 collector。
  jaeger:
    image: jaegertracing/all-in-one:1.60
    ports:
      - "16686:16686" # UI
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP

volumes:
  pgdata:
